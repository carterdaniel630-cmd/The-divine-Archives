<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>A Chapter at Random — The Divine Archives</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9C%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="assets/archive.css" />
  <script>
    // Pick a random published chapter from the search index and go there.
    (function () {
      fetch("assets/search-index.json")
        .then(function (r) { return r.json(); })
        .then(function (docs) {
          if (!docs || !docs.length) throw new Error("empty");
          var pick = docs[Math.floor(Math.random() * docs.length)];
          location.replace("chapters/" + encodeURIComponent(pick.id) + ".html");
        })
        .catch(function () { location.replace("eras.html"); });
    })();
  </script>
</head>
<body>
  <div class="page" style="min-height:60vh;display:flex;align-items:center;justify-content:center">
    <p class="eyebrow" style="text-align:center">Drawing a scroll at random&hellip;<br>
      <noscript><a href="eras.html">Browse the ages instead.</a></noscript>
      <a href="eras.html" style="display:inline-block;margin-top:1rem">Browse the ages</a>
    </p>
  </div>
</body>
</html>
