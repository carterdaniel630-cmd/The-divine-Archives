<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lost in the stacks — The Divine Archives</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9C%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="assets/archive.css" />
  <style>
    .lost { min-height: 82vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 1.4rem; padding: 4rem 1.6rem; }
    .lost .glyph { font-family: var(--font-display); font-size: clamp(4rem, 16vw, 9rem); color: var(--gold); letter-spacing: 0.1em; line-height: 1; opacity: 0.85; }
    .lost h1 { font-family: var(--font-display); font-weight: 400; text-transform: uppercase; letter-spacing: 0.16em; color: var(--parchment); font-size: clamp(1.4rem, 4vw, 2rem); margin: 0; }
    .lost p { max-width: 32rem; color: var(--ink-dim); font-style: italic; margin: 0; }
    .lost a.back { font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.2em; font-size: 0.72rem; border: 1px solid var(--line); padding: 0.75rem 1.4rem; border-radius: 2px; }
    .lost a.back:hover { border-color: var(--gold); }
  </style>
</head>
<body>
<div class="page lost">
  <div class="glyph">CDX</div>
  <div class="ornament"><span>&#10022;</span></div>
  <h1>This leaf is missing from the codex</h1>
  <p>The page you sought is not in the archive &mdash; mislaid, renamed, or never written. Even the most careful library has its gaps, and admits them.</p>
  <a class="back" href="index.html">Return to the archive</a>
</div>
<script src="assets/ambient.js" defer></script>
</body>
</html>
