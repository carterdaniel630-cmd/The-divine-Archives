<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:,">
  <title>The Royal Game of Ur</title>
  <style>
    :root{color-scheme:light dark;--night:#100b08;--deep:#17100c;--panel:#211610;--wood:#3b2114;--wood2:#6d3c20;--gold:#d6a84e;--gold-hi:#f3d27a;--lapis:#123b69;--lapis-hi:#2c6e9d;--shell:#eadfc5;--shell-hi:#fffaf0;--red:#8f3324;--ink:#1c120b;--text:#f3e5ca;--muted:#c6ad86;--line:#76502d;--shadow:rgba(0,0,0,.65);--focus:#ffe39a;--good:#87a979;--danger:#bd6551}
    @media(prefers-color-scheme:light){:root{--night:#d7c39e;--deep:#ead9b9;--panel:#f0dfbd;--wood:#5a321b;--wood2:#8c5430;--gold:#9a641a;--gold-hi:#c28a31;--lapis:#174c7c;--lapis-hi:#3986b3;--shell:#fff8e7;--shell-hi:#fff;--red:#9a3d2a;--ink:#1d120b;--text:#291b10;--muted:#66503b;--line:#a77b45;--shadow:rgba(54,32,13,.28);--focus:#5d3407}}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--night)}
    body{font-family:Georgia,"Times New Roman",serif;color:var(--text);overflow-x:hidden}
    button,select{font:inherit}
    ur-game{display:block;min-height:100vh}
  </style>
</head>
<body>
<ur-game></ur-game>
<script>
(function(){
'use strict';
const CONFIG=Object.freeze({assetRegistry:Object.freeze({}),ruleset:'Finkel reconstruction',schema:'urn:divine-archives:ur-game:v1'});
const PATH={
  white:[[0,3],[0,2],[0,1],[0,0],[1,0],[1,1],[1,2],[1,3],[1,4],[1,5],[1,6],[1,7],[0,6],[0,7]],
  black:[[2,3],[2,2],[2,1],[2,0],[1,0],[1,1],[1,2],[1,3],[1,4],[1,5],[1,6],[1,7],[2,6],[2,7]]
};
const ROSETTES=new Set([4,8,14]);
const CELL_ROSETTES=new Set(['0-0','1-3','0-6','2-0','2-6']);
const NeutralityValidator={
  validateState(s){
    if(!s||!['white','black'].includes(s.turn)||!['ai','local'].includes(s.mode))return false;
    if(!Array.isArray(s.white)||!Array.isArray(s.black)||s.white.length!==7||s.black.length!==7)return false;
    if([...s.white,...s.black].some(v=>!Number.isInteger(v)||v<0||v>15))return false;
    for(const side of ['white','black']){const a=s[side].filter(v=>v>0&&v<15);if(new Set(a).size!==a.length)return false;}
    for(let p=5;p<=12;p++){const w=s.white.includes(p),b=s.black.includes(p);if(w&&b)return false;}
    return s.rolled===null||(Number.isInteger(s.rolled)&&s.rolled>=0&&s.rolled<=4);
  },
  acceptPayload(p){return !!p&&typeof p.type==='string'&&p.type.length<48&&Number.isFinite(p.at)}
};
const copy=s=>JSON.parse(JSON.stringify(s));
const ease='cubic-bezier(.22,.78,.26,1)';

class UrGame extends HTMLElement{
  constructor(){
    super();
    this.config=CONFIG;this._listeners=[];this._timers=new Set();this._animations=new Set();this._ledger=[];this._lastCommand=null;this._retryAt=0;this._audio=null;this._destroyed=false;this._mobile=/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)||innerWidth<720;this._dpr=this._mobile?1:Math.min(devicePixelRatio||1,2);this.root=this;
    this.state=this.freshState('ai',2);
  }
  connectedCallback(){this.renderShell();this.bind();this.paint();}
  disconnectedCallback(){this.destroy();}
  freshState(mode,difficulty){return {schema:this.config.schema,mode,difficulty,turn:'white',white:[0,0,0,0,0,0,0],black:[0,0,0,0,0,0,0],rolled:null,dice:[0,0,0,0],winner:null,moveNo:0,started:false};}
  listen(el,event,fn,opts){if(!el)return;el.addEventListener(event,fn,opts);this._listeners.push(()=>el.removeEventListener(event,fn,opts));}
  later(fn,ms){const id=setTimeout(()=>{this._timers.delete(id);if(!this._destroyed)fn();},ms);this._timers.add(id);return id;}
  record(type,data={}){const event=Object.freeze({schema:this.config.schema,type,at:Date.now(),sequence:this._ledger.length+1,data:copy(data)});if(!NeutralityValidator.acceptPayload(event)){this._retryAt=Date.now()+1200;return false;}this._ledger.push(event);return true;}
  guardedState(next,type,data={}){if(Date.now()<this._retryAt)return false;if(!NeutralityValidator.validateState(next)){this._retryAt=Date.now()+1200;this.status('That move was rejected: the board state did not pass its integrity check.','warn');return false;}this.state=next;this.record(type,data);return true;}
  renderShell(){
    const dust=Array.from({length:this._mobile?10:24},(_,i)=>`<i style="--x:${(i*37)%101}%;--y:${(i*61)%97}%;--d:${7+(i%7)}s;--s:${1+(i%3)}px"></i>`).join('');
    this.root.innerHTML=`<style>${this.styles()}</style>
    <div class="scene">
      <div class="torch t1"></div><div class="torch t2"></div><div class="dust" aria-hidden="true">${dust}</div>
      <main>
        <section class="intro" aria-labelledby="lead-title">
          <div class="inscription" aria-hidden="true"><span>𒀭</span><span>𒆠</span><span>𒂗</span></div>
          <div><p class="eyebrow">Ur · Early Dynastic III · c. 2600–2400 BCE</p><h1 id="lead-title">Race beneath the rosettes.</h1><p class="lede">Seven pieces. Twenty inlaid squares. One narrow road where fortune becomes strategy.</p></div>
          <button class="aboutBtn quiet" type="button">History & evidence</button>
        </section>
        <section class="setup" aria-label="Match setup">
          <div class="modeSwitch" role="group" aria-label="Opponent"><button class="mode active" data-mode="ai">Play the keeper</button><button class="mode" data-mode="local">Two at the board</button></div>
          <label class="difficulty">Keeper skill <select aria-label="AI difficulty"><option value="1">Initiate</option><option value="2" selected>Scribe</option><option value="3">Master</option></select></label>
          <button class="newBtn seal">Begin a new match</button>
        </section>
        <section class="game" aria-label="Royal Game of Ur board">
          <div class="player whitePanel" data-player="white"><div class="playerHead"><span class="sample white"></span><div><strong>Shell</strong><small class="playerKind">You</small></div></div><div class="tally"><span class="reserveW">7 waiting</span><span class="offW">0 borne off</span></div></div>
          <div class="table">
            <div class="boardWrap">
              <div class="boardHalo" aria-hidden="true"></div>
              <div class="board" role="grid" aria-label="Twenty-square game board"></div>
            </div>
            <div class="centerControls">
              <div class="turn"><span class="turnLamp"></span><div><small>THE TURN</small><strong class="turnText">Shell begins</strong></div></div>
              <div class="diceTray" aria-live="polite"><div class="dice"></div><div class="rollTotal"><small>CAST</small><strong>—</strong></div></div>
              <button class="rollBtn seal" disabled>Cast the tetrahedra</button>
              <button class="undoBtn quiet" disabled>Undo last move</button>
            </div>
          </div>
          <div class="player blackPanel" data-player="black"><div class="playerHead"><span class="sample black"></span><div><strong>Basalt</strong><small class="playerKind">The keeper</small></div></div><div class="tally"><span class="reserveB">7 waiting</span><span class="offB">0 borne off</span></div></div>
        </section>
        <div class="status" role="status">Choose the table, then begin.</div>
        <section class="key" aria-label="Board key"><span><b class="rosetteMini">✺</b> Rosette: cast again</span><span><b class="sharedMini"></b> Middle road: pieces may be captured</span><span><b class="safeMini">✺</b> Central rosette: safe</span></section>
      </main>
      <div class="tools"><button class="soundBtn" aria-pressed="false" title="Toggle ambient sound"><span>◖</span> Sound</button><button class="teachBtn">How to play</button></div>
      <div class="overlay setupOverlay open" role="dialog" aria-modal="true" aria-labelledby="welcome-title"><div class="modal welcome"><button class="closeSetup x" aria-label="Close">×</button><p class="eyebrow">A table from the royal tombs</p><h2 id="welcome-title">Bring all seven pieces home.</h2><p>The rosettes reward a second cast. The middle road is shared. There, one exact landing can send a rival back to the beginning.</p><div class="welcomeActions"><button class="startAI seal">Face the keeper</button><button class="startLocal quiet">Play beside a friend</button></div><button class="openTutorial textBtn">Learn the game first →</button></div></div>
      <div class="overlay tutorialOverlay" role="dialog" aria-modal="true" aria-labelledby="tutorial-title"><div class="modal tutorial"><button class="closeTutorial x" aria-label="Close">×</button><p class="stepCount">I / IV</p><div class="tutorialGlyph"></div><h2 id="tutorial-title">Cast four tetrahedra</h2><p class="tutorialCopy">Each marked point facing upward counts one. A cast moves one piece from zero to four squares.</p><div class="tutorialNav"><button class="tutorialPrev quiet" disabled>Back</button><button class="tutorialNext seal">Next</button></div></div></div>
      <div class="overlay aboutOverlay" role="dialog" aria-modal="true" aria-labelledby="about-title"><article class="modal about"><button class="closeAbout x" aria-label="Close">×</button><p class="eyebrow">History & evidence</p><h2 id="about-title">An ancient board, a later rulebook</h2><p>The inlaid board that inspires this table was made in southern Iraq around 2600–2400 BCE and excavated by Sir Leonard Woolley in the Royal Cemetery at Ur. Its wooden core decayed, while shell plaques and ornamental inlays survived.</p><p>The rules were not found beside that board. A much later Babylonian tablet, written in 177 BCE, preserves instructions for a game of twenty squares. Irving Finkel’s reading made a playable reconstruction possible.</p><p>This edition follows that widely played reconstruction: seven pieces per side, four binary tetrahedra, a shared road, protected central rosette, extra casts on rosettes, captures, and exact bearing off. The route and fine points are scholarly reconstruction—not a claim that every table in ancient Mesopotamia used identical rules.</p><p class="materialNote">The original board bears patterned inlay, not a written title. The small cuneiform signs around this room are atmospheric references to Mesopotamian tablet culture; they are not copied onto the playing surface.</p><a href="http://www.britishmuseum.org/explore/highlights/highlight_objects/me/t/the_royal_game_of_ur.aspx" target="_blank" rel="noopener">British Museum collection record ↗</a><p class="catalogue">Game-board 120834 · Registration 1928,1009.378</p></article></div>
      <div class="overlay victoryOverlay" role="dialog" aria-modal="true" aria-labelledby="victory-title"><div class="modal victory"><div class="victoryRosette">✺</div><p class="eyebrow">The road is complete</p><h2 id="victory-title">Shell has borne all seven home.</h2><p class="victoryCopy">Fortune opened the way. Judgment carried the pieces through.</p><button class="rematch seal">Play again</button></div></div>
    </div>`;
  }
  styles(){return `
    ur-game{display:block;min-height:100vh;--cell:min(9.2vw,64px)}
    .scene{min-height:100vh;position:relative;isolation:isolate;overflow:hidden;background:radial-gradient(circle at 50% -10%,rgba(174,99,35,.22),transparent 38%),linear-gradient(180deg,rgba(7,5,4,.18),rgba(0,0,0,.54)),repeating-linear-gradient(92deg,rgba(255,255,255,.012) 0 1px,transparent 1px 5px),var(--night)}
    .scene:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-2;background:radial-gradient(ellipse at 50% 16%,transparent 0 24%,rgba(0,0,0,.48) 74%),linear-gradient(90deg,rgba(0,0,0,.45),transparent 20% 80%,rgba(0,0,0,.45))}
    .torch{position:fixed;top:2rem;width:6px;height:90px;background:linear-gradient(#d59b4c,#5c2c13);box-shadow:0 0 45px 16px rgba(223,113,37,.16);z-index:-1}.torch:before{content:"";position:absolute;left:-13px;top:-26px;width:32px;height:40px;border-radius:60% 40% 60% 35%;background:radial-gradient(circle at 50% 70%,#fff1a9 0 8%,#f0a039 30%,#873316 65%,transparent 70%);filter:drop-shadow(0 0 10px #e0762f);animation:flame 2.7s ease-in-out infinite alternate}.t1{left:4vw}.t2{right:4vw;animation-delay:-1.3s}@keyframes flame{to{transform:skewX(5deg) scale(.94,1.06);filter:drop-shadow(0 0 14px #e0762f)}}
    .dust{position:fixed;inset:0;pointer-events:none;z-index:-1}.dust i{position:absolute;left:var(--x);top:var(--y);width:var(--s);height:var(--s);border-radius:50%;background:#f4cf8b;opacity:.22;animation:drift var(--d) linear infinite}@keyframes drift{0%{transform:translate3d(0,25px,0);opacity:0}20%{opacity:.28}100%{transform:translate3d(16px,-80px,0);opacity:0}}
    main{width:min(1180px,calc(100% - 28px));margin:0 auto;padding:clamp(26px,5vw,68px) 0 96px}
    .intro{display:grid;grid-template-columns:auto 1fr auto;gap:24px;align-items:center;margin-bottom:24px}.inscription{display:grid;gap:2px;color:var(--gold);font-size:22px;opacity:.7;border-right:1px solid var(--line);padding-right:18px}.eyebrow{margin:0 0 7px;color:var(--gold-hi);font:600 11px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase}.intro h1{font-size:clamp(30px,4.4vw,58px);line-height:.96;font-weight:500;letter-spacing:-.03em;margin:0;max-width:720px;text-shadow:0 2px 24px rgba(0,0,0,.6)}.lede{margin:11px 0 0;color:var(--muted);font-size:clamp(15px,2vw,19px)}
    button,select{color:inherit}button{cursor:pointer}.quiet,.soundBtn,.teachBtn{border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(0,0,0,.12));padding:10px 14px;color:var(--text)}button:focus-visible,select:focus-visible,.cell:focus-visible{outline:3px solid var(--focus);outline-offset:3px}.seal{border:1px solid #b27c2e;border-radius:2px;background:linear-gradient(180deg,#e1b75e,#a66c20 52%,#744310);color:#160d06;text-shadow:0 1px rgba(255,255,255,.25);font-weight:700;box-shadow:inset 0 1px #f8d98f,inset 0 -2px rgba(57,28,6,.65),0 5px 14px rgba(0,0,0,.3);padding:11px 18px}.seal:not(:disabled):active{transform:translateY(1px);box-shadow:inset 0 2px 4px rgba(0,0,0,.35)}button:disabled{opacity:.38;cursor:not-allowed}
    .setup{display:flex;align-items:center;gap:16px;padding:12px 14px;margin-bottom:20px;background:linear-gradient(90deg,rgba(255,255,255,.04),transparent);border-top:1px solid rgba(214,168,78,.28);border-bottom:1px solid rgba(214,168,78,.18)}.modeSwitch{display:flex}.mode{border:1px solid var(--line);background:transparent;padding:9px 12px}.mode+.mode{border-left:0}.mode.active{background:var(--gold);color:var(--ink);font-weight:bold}.difficulty{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}.difficulty select{background:var(--panel);border:1px solid var(--line);padding:8px}.newBtn{margin-left:auto}
    .game{display:grid;grid-template-columns:minmax(150px,1fr) minmax(0,760px) minmax(150px,1fr);gap:18px;align-items:center}.player{align-self:stretch;min-height:150px;padding:18px 14px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid rgba(214,168,78,.24);background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(0,0,0,.18));box-shadow:inset 0 0 28px rgba(0,0,0,.22);transition:border-color .35s,box-shadow .35s}.player.active{border-color:var(--gold);box-shadow:inset 0 0 28px rgba(0,0,0,.22),0 0 22px rgba(215,158,62,.15)}.playerHead{display:flex;gap:11px;align-items:center}.playerHead strong{display:block;font-size:18px}.playerHead small{display:block;color:var(--muted);margin-top:2px}.sample,.piece{width:34px;height:34px;border-radius:50%;display:block;position:relative;box-shadow:inset 0 2px 3px rgba(255,255,255,.5),inset 0 -4px 5px rgba(0,0,0,.42),0 5px 9px rgba(0,0,0,.45)}.sample:after,.piece:after{content:"";position:absolute;inset:7px;border-radius:50%;background:radial-gradient(circle at center,currentColor 0 2px,transparent 3px),radial-gradient(circle at 15% 15%,currentColor 0 2px,transparent 3px),radial-gradient(circle at 85% 15%,currentColor 0 2px,transparent 3px),radial-gradient(circle at 15% 85%,currentColor 0 2px,transparent 3px),radial-gradient(circle at 85% 85%,currentColor 0 2px,transparent 3px)}.white{background:conic-gradient(from 30deg,#fff8df,#c7d2c6,#fff8df,#d7bfc4,#fff8df);color:#403932}.black{background:radial-gradient(circle at 35% 22%,#52545b,#17191d 48%,#050506);color:#e8dfc8}.tally{display:grid;gap:4px;color:var(--muted);font-size:12px}
    .table{min-width:0}.boardWrap{position:relative;margin:auto;perspective:1000px;filter:drop-shadow(0 24px 22px rgba(0,0,0,.54))}.boardHalo{position:absolute;inset:7% 8%;background:rgba(237,164,63,.16);filter:blur(26px);animation:halo 4.8s ease-in-out infinite alternate}@keyframes halo{to{opacity:.46;transform:scale(1.035)}}
    .board{position:relative;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(3,1fr);gap:4px;width:100%;aspect-ratio:8/3;padding:18px;border:9px ridge #7c4b25;background:repeating-linear-gradient(7deg,rgba(255,224,160,.045) 0 2px,rgba(55,26,10,.08) 2px 7px),linear-gradient(90deg,#2e170c,#75421f 18%,#43220f 45%,#774823 72%,#2d160b);box-shadow:inset 0 0 0 3px #251005,inset 0 0 0 6px #b3782e,inset 0 0 28px 10px rgba(0,0,0,.55),0 1px 0 #dfad57;transform:rotateX(3deg);transform-origin:50% 100%}
    .board:before,.board:after{content:"";position:absolute;pointer-events:none}.board:before{inset:6px;border:1px solid #e1b65e;box-shadow:inset 0 0 0 2px #4b2510}.board:after{inset:10px;background:repeating-linear-gradient(90deg,transparent 0 18px,rgba(242,197,101,.15) 19px 20px);mix-blend-mode:screen;opacity:.35}
    .cell{position:relative;min-width:0;min-height:0;border:1px solid #b58a4c;background:radial-gradient(circle at 70% 18%,rgba(255,255,255,.16),transparent 25%),repeating-linear-gradient(113deg,rgba(255,255,255,.04) 0 1px,transparent 1px 5px),linear-gradient(145deg,var(--shell-hi),#b9a98a 56%,#78674e);box-shadow:inset 0 0 0 2px rgba(54,31,12,.58),inset 0 0 11px rgba(255,255,255,.28),0 2px 4px rgba(0,0,0,.6);padding:0;overflow:visible;z-index:1}.cell.lapis{background:radial-gradient(circle at 28% 20%,rgba(119,198,227,.36),transparent 20%),repeating-radial-gradient(ellipse at 72% 50%,rgba(255,255,255,.06) 0 1px,transparent 2px 7px),linear-gradient(145deg,#2b78a0,#113d6b 48%,#071c38);border-color:#b9a965}.cell.red{background:radial-gradient(circle at 30% 20%,rgba(255,181,139,.25),transparent 25%),repeating-linear-gradient(28deg,rgba(255,255,255,.05) 0 1px,transparent 1px 6px),linear-gradient(145deg,#a84d35,#702317);border-color:#c59c58}.cell.gap{visibility:hidden;pointer-events:none}.cell .motif{position:absolute;inset:10%;opacity:.9}.motif.eye:before{content:"";position:absolute;inset:30% 6%;border:2px solid rgba(42,24,12,.68);border-radius:80% 20% 80% 20%;transform:rotate(45deg)}.motif.eye:after{content:"";position:absolute;width:18%;aspect-ratio:1;left:41%;top:41%;border-radius:50%;background:#172f43;box-shadow:0 0 0 3px #bf8739}.motif.dots{background:radial-gradient(circle,#6f301d 0 7%,transparent 8%) 0 0/33.33% 33.33%}.rosetteSvg{width:100%;height:100%;filter:drop-shadow(0 1px 1px rgba(0,0,0,.55))}.rosetteSvg .petal{fill:#f6ead0;stroke:#5f3516;stroke-width:1.1}.rosetteSvg .core{fill:#9d3424;stroke:#e7bb57;stroke-width:1}.rosetteSvg .ray{stroke:#8a5524;stroke-width:.8}.cell.legal{z-index:4;animation:legalPulse 1.15s ease-in-out infinite alternate;cursor:pointer}.cell.legal:after{content:"";position:absolute;inset:-3px;border:3px solid var(--gold-hi);box-shadow:0 0 17px rgba(255,206,98,.7),inset 0 0 13px rgba(255,206,98,.45);pointer-events:none}@keyframes legalPulse{to{filter:brightness(1.25)}}.cell.selectable{cursor:pointer}.cell.selectable:hover{filter:brightness(1.12)}
    .piece{position:absolute;width:64%;height:64%;left:18%;top:18%;z-index:8;border:0;transition:transform .52s ${ease},filter .25s}.piece:hover{filter:brightness(1.16)}.piece.selectable{animation:pieceBreathe 1s ease-in-out infinite alternate}.piece.selectable:before{content:"";position:absolute;inset:-8px;border:2px solid var(--gold-hi);border-radius:50%;box-shadow:0 0 14px var(--gold)}@keyframes pieceBreathe{to{transform:translateY(-4px) rotateX(8deg)}}
    .centerControls{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;margin-top:14px}.turn{display:flex;gap:9px;align-items:center;min-width:130px}.turnLamp{width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold)}.turn small,.rollTotal small{display:block;font:600 9px ui-monospace,monospace;letter-spacing:.13em;color:var(--muted)}.turn strong{display:block;margin-top:2px;font-size:14px}.diceTray{display:flex;align-items:center;justify-content:center;gap:10px;padding:6px 10px;border:1px solid rgba(214,168,78,.2);background:rgba(0,0,0,.18);min-height:53px}.dice{display:flex;gap:6px}.die{width:32px;height:32px;position:relative;display:grid;place-items:center;clip-path:polygon(50% 0,100% 88%,0 88%);background:linear-gradient(145deg,#fff4d6 0 46%,#9b8768 48% 72%,#6d5a41 73%);filter:drop-shadow(0 4px 3px rgba(0,0,0,.5));transform-origin:50% 65%}.die:before{content:"";width:7px;height:7px;border-radius:50%;background:#7e2c20;box-shadow:inset 0 1px 1px #e8aa7c;opacity:var(--mark,0)}.die.rolling{animation:tumble .78s ${ease}}@keyframes tumble{0%{transform:translateY(0) rotate(0)}25%{transform:translateY(-18px) rotate(115deg) scale(.9)}55%{transform:translateY(-5px) rotate(235deg) scale(1.08,.92)}80%{transform:translateY(1px) rotate(340deg) scale(.98,1.03)}100%{transform:none}}.rollTotal strong{font-size:25px;color:var(--gold-hi)}.undoBtn{padding:10px}.status{text-align:center;min-height:28px;margin:18px auto 4px;color:var(--muted);font-style:italic}.status.warn{color:#e7a38f}.status.good{color:#b6d7a5}.key{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;margin:14px auto 0;padding-top:13px;border-top:1px solid rgba(214,168,78,.16);font-size:12px;color:var(--muted)}.key span{display:flex;gap:7px;align-items:center}.rosetteMini,.safeMini{font-size:16px;color:var(--gold)}.safeMini{background:var(--lapis);padding:0 4px}.sharedMini{width:14px;height:14px;background:var(--lapis);border:1px solid var   buildBoard(){const board=this.root.querySelector('.board');board.innerHTML='';for(let r=0;r<3;r++)for(let c=0;c<8;c++){const key=`${r}-${c}`,gap=(r!==1&&(c===4||c===5));const cell=document.createElement(gap?'div':'button');if(!gap)cell.type='button';cell.className='cell '+(gap?'gap':(r===1?'lapis':((r+c)%4===2?'red':'')));cell.dataset.cell=key;cell.setAttribute('role','gridcell');if(!gap){const motif=document.createElement('span');if(CELL_ROSETTES.has(key)){motif.innerHTML=this.rosetteSvg();motif.className='motif';cell.setAttribute('aria-label','Rosette square');}else{motif.className='motif '+(((r*8+c)%3===0)?'eye':'dots');cell.setAttribute('aria-label',r===1?'Shared road square':'Private road square');}cell.appendChild(motif);}board.appendChild(cell);}}

  movePiece(index,isAI){const side=this.state.turn,oppSide=this.other(side),roll=this.state.rolled;if(!this.legalMoves(side,roll).includes(index))return;const before=copy(this.state),after=copy(this.state),from=after[side][index],dest=from+roll;let captured=-1;if(dest>=5&&dest<=12){captured=after[oppSide].indexOf(dest);if(captured>=0)after[oppSide][captured]=0;}after[side][index]=dest;after.rolled=null;after.moveNo++;const won=after[side].every(v=>v===15);if(won)after.winner=side;else if(!ROSETTES.has(dest))after.turn=oppSide;const command={type:'piece.move',before,after,side,index,from,dest,forward:()=>this.guardedState(copy(after),'piece.move',{side,index,from,dest,captured}),reverse:()=>this.guardedState(copy(before),'piece.reverse',{side,index,from:dest,dest:from})};if(!command.forward())return;this._lastCommand=command;this.record('command.register',{forward:'piece.move',reverse:'piece.reverse'});this.animateMove(side,index,from,dest);this.paint();if(captured>=0)this.status(`${this.name(side)} captures a rival piece and sends it back to the beginning.`,'good');else if(won)this.status(`${this.name(side)} bears the seventh piece home.`,'good');else if(ROSETTES.has(dest))this.status(`The rosette answers ${this.name(side)}. Cast again.`,'good');else this.status(`${this.name(after.turn)} now holds the cast.`);if(won)this.later(()=>this.showVictory(side),700);else this.scheduleAI();}

    const wOff=this.state.white.filter(v=>v===15).length,bOff=this.state.black.filter(v=>v===15).length,wRes=this.state.white.filter(v=>v===0).length,bRes=this.state.black.filter(v=>v===0).length;this.text('.reserveW',`${wRes} waiting`);this.text('.offW',`${wOff} borne off`);this.text('.reserveB',`${bRes} waiting`);this.text('.offB',`${bOff} borne off`);this.text('.turnText',this.state.started?`${this.name(this.state.turn)} ${this.state.rolled===null?'casts':'moves'}`:'Shell begins');this.root.querySelector('.whitePanel').classList.toggle('active',this.state.turn==='white'&&this.state.started);this.root.querySelector('.blackPanel').classList.toggle('active',this.state.turn==='black'&&this.state.started);
