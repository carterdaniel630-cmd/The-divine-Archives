<script>
(function(){'use strict';

class AntikytheraRelic extends HTMLElement{

 render(){this.innerHTML=`<section class="museum"><div class="instrument"><canvas aria-label="Interactive reconstruction of the Antikythera mechanism. Drag the right-hand crank to advance it." role="img"></canvas><div class="readout"><div class="date"></div><div class="sub"></div></div><div class="hint">drag the crank · tap a dial to inspect</div><div class="controls"><div class="seg" aria-label="Choose face"><button data-face="front" aria-pressed="true">Front</button><button data-face="back" aria-pressed="false">Back</button></div><button class="action" data-xray aria-pressed="false">X-ray</button><button class="action" data-fragments aria-pressed="false">Fragments</button><button class="action" data-today>Today</button><button class="action sound" data-sound aria-label="Toggle mechanical sound" aria-pressed="false">♩</button></div><div class="toast" role="dialog" aria-live="polite"><strong></strong><span></span><button>Close</button></div></div><aside class="side"><section class="card"><div class="kicker">Instrument reading</div><h2 data-reading>Celestial register</h2><div class="datum"><span>Solar position</span><span data-sun></span></div><div class="datum"><span>Lunar phase</span><span data-moon></span></div><div class="datum"><span>Metonic cycle</span><span data-metonic></span></div><div class="eclipse"><strong data-eclipse></strong><p data-eclipse-note></p></div></section><section class="card"><div class="kicker">Read the bronze</div><div class="dial-menu"><button data-info="front" aria-pressed="true">Front calendar</button><button data-info="moon">Moon display</button><button data-info="metonic">Metonic spiral</button><button data-info="saros">Saros dial</button><button data-info="gears">Gear train</button><button data-info="wreck">The wreck</button></div><div class="drawer open" data-drawer></div></section><section class="card"><div class="kicker">Evidence & reconstruction</div><p>The surviving fragments establish a hand-driven bronze gearwork with calendrical, lunar, eclipse, and games displays. Much of the front is lost. This model keeps attested labels and cycles distinct from reconstructed layout.</p><div class="evidence"><a href="https://antikythera-mechanism.namuseum.gr/en/" target="_blank" rel="noopener">National Archaeological Museum</a><a href="https://ktisis.cut.ac.cy/bitstream/20.500.14279/24253/1/heritage-04-00211-v4.pdf" target="_blank" rel="noopener">Research overview</a></div><p class="footnote">The eclipse readout is a mechanism-style Saros approximation, not a modern astronomical forecast. Dial spacing and missing front gearing are interpretive reconstructions.</p></section><section class="card"><div class="kicker">Further instruments</div><div class="next-list"><div class="next-item"><b>01</b><span><strong>Astrolabe</strong> — sight a star, set latitude, read the hour.</span></div><div class="next-item"><b>02</b><span><strong>Oracle Bones of Anyang</strong> — inscribe, heat, and interpret a documented divination sequence.</span></div><div class="next-item"><b>03</b><span><strong>Senet</strong> — a playable passage through the Egyptian board of thirty houses.</span></div><div class="next-item"><b>04</b><span><strong>Library Rescue</strong> — carry endangered scrolls through a collapsing archive.</span></div></div></section></aside></section>`}
 cache(){this.canvas=this.querySelector('canvas');this.ctx=this.canvas.getContext('2d',{alpha:false,desynchronized:true});this.$=s=>this.querySelector(s)}

frag(c,x,y,r,seed,s){c.save();c.translate(x,y);c.shadowColor='#000';c.shadowBlur=18*s;c.shadowOffsetY=10*s;c.beginPath();const n=12;for(let i=0;i<=n;i++){const a=i/n*TAU,j=.72+.5*Math.abs(Math.sin(seed*7.3+i*2.17)),px=Math.cos(a)*r*j,py=Math.sin(a)*r*j*.82;i?c.lineTo(px,py):c.moveTo(px,py)}c.closePath();const g=c.createRadialGradient(-r*.3,-r*.35,r*.1,0,0,r*1.15);g.addColorStop(0,'#4f8a72');g.addColorStop(.45,'#2b5c4b');g.addColorStop(.8,'#16352b');g.addColorStop(1,'#0c1f18');c.fillStyle=g;c.fill();c.shadowBlur=0;c.strokeStyle='#0a1a14';c.lineWidth=2*s;c.stroke();for(let i=0;i<7;i++){const px=Math.sin(seed*13.1+i*5.7)*.5*r,py=Math.cos(seed*9.4+i*3.3)*.42*r,pr=(2+Math.abs(Math.sin(seed+i*3))*4)*s;c.fillStyle='#0d211a';c.beginPath();c.arc(px,py,pr,0,TAU);c.fill()}c.strokeStyle='#7fc7a888';c.lineWidth=1.5*s;for(let i=0;i<4;i++){c.beginPath();const sx=Math.sin(seed*3+i*2.4)*r*.5;c.moveTo(sx,-r*.6);c.quadraticCurveTo(sx+Math.sin(seed+i)*10*s,0,sx-r*.2,r*.55);c.stroke()}c.strokeStyle='#08120e';c.lineWidth=1.2*s;c.beginPath();c.moveTo(-r*.5,-r*.1);c.lineTo(-r*.1,r*.25);c.lineTo(r*.15,r*.1);c.stroke();c.restore()}
disconnectedCallback(){this.destroy()}
 destroy(){this.destroyed=true;cancelAnimationFrame(this.raf);clearTimeout(this.retryTimer);this.listeners.forEach(fn=>fn());this.listeners.length=0;if(this.audio){this.audio.close();this.audio=null}if(this.ctx){this.ctx.setTransform(1,0,0,1,0,0);this.ctx.clearRect(0,0,this.canvas.width,this.canvas.height)}this.canvas.width=1;this.canvas.height=1;this.dust.length=0;this.ledger.length=0;this.ctx=null;this.canvas=null}
}
