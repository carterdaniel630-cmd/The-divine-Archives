name: Knowledge graph (graphify)

# Builds graphify's map of the repository's code (the build tools, games, museum, framework and
# Pages Functions) and publishes it to the `graph` branch, where every Claude Code session picks it
# up at start (tools/graphify-session.sh). Nothing here touches main or the live site.
#
#   push to main      build the graph and replace the `graph` branch with it (one commit, no history)
#   pull_request      build the graph as a check and upload it as an artifact; publishes nothing
#   workflow_dispatch build and publish by hand
#
# Code only: the code is parsed locally with tree-sitter, so no AI runs and no API key is used.
# Chapters, Vault entries and other prose are not in this graph (they need a separate, approved pass).
# Files left out are listed in .graphifyignore (KEY.md answer keys among them).

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".github/workflows/graphify.yml"
      - ".graphifyignore"
      - ".claude/**"
      - "tools/graphify-session.sh"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: graphify-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRAPHIFY_VERSION: "0.9.85"

jobs:
  graph:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install graphify (pinned to the skill's version)
        run: python -m pip install --disable-pip-version-check "graphifyy==${GRAPHIFY_VERSION}"

      - name: Build the code graph
        run: |
          set -o pipefail
          graphify extract . --code-only 2>&1 | tail -60
          test -s graphify-out/graph.json || { echo "::error::graphify produced no graph.json"; exit 1; }
          # extract stops at graph.json; cluster-only writes GRAPH_REPORT.md and graph.html.
          # --no-label: community names would need an AI backend, so they stay numbered.
          graphify cluster-only . --no-label 2>&1 | tail -20
          test -s graphify-out/GRAPH_REPORT.md || { echo "::error::graphify produced no GRAPH_REPORT.md"; exit 1; }

      - name: Check the output
        run: |
          set -eu
          cd graphify-out
          rm -f .graphify_python
          # Paths must be repo-relative so the graph works in any session's checkout.
          ws="${GITHUB_WORKSPACE%/}"
          grep -rlF "$ws/" . | while read -r f; do sed -i "s#${ws}/##g" "$f"; done
          grep -rlF "$ws" . | while read -r f; do sed -i "s#${ws}#.#g" "$f"; done
          if grep -rqF "/home/runner" .; then
            echo "::error::runner paths left in the graph"
            grep -rcF "/home/runner" . | grep -v ':0$' | head -10 | while read -r l; do echo "::error::file $l"; done
            grep -rohE '.{0,40}/home/runner[^"]{0,60}' . | sort | uniq -c | sort -rn | head -8 | while read -r l; do echo "::error::seen $l"; done
            exit 1
          fi
          # The answer keys must never be indexed.
          if grep -rq 'KEY\.md' graph.json; then echo "::error::a KEY.md file reached the graph"; exit 1; fi
          # Stay well under GitHub's 100 MB file limit.
          find . -type f -size +50M | grep . && { echo "::error::graph file over 50 MB"; exit 1; } || true
          ls -la
          python - <<'PY'
          import json
          g = json.load(open("graph.json"))
          n = len(g.get("nodes", [])); e = len(g.get("links", g.get("edges", [])))
          files = sorted({x.get("source_file","") for x in g.get("nodes", []) if x.get("source_file")})
          print(f"::notice::graph: {n} nodes, {e} edges from {len(files)} files")
          tops = sorted({f.split("/")[0] for f in files})
          print("::notice::top-level folders mapped: " + ", ".join(tops))
          assert n > 0, "empty graph"
          PY
          echo "::notice::report: $(wc -l < GRAPH_REPORT.md) lines; files: $(ls | tr '\n' ' ')"

      - name: Upload the graph (pull requests)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: graphify-out
          path: graphify-out/
          include-hidden-files: true
          retention-days: 7

      - name: Publish to the graph branch
        if: github.event_name != 'pull_request'
        env:
          SHA: ${{ github.sha }}
        run: |
          set -eu
          printf 'main @ %s\n' "$(git rev-parse --short "$SHA")" > graphify-out/SOURCE
          tmp="$(mktemp -d)"
          mv graphify-out "$tmp/"
          cd "$tmp"
          git init -q -b graph
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '# Knowledge graph\n\nBuilt by .github/workflows/graphify.yml from main @ %s. Generated: do not edit.\nSessions pull graphify-out/ from here at start (tools/graphify-session.sh).\n' "$SHA" > README.md
          git add -A
          git commit -q -m "Knowledge graph of main @ ${SHA:0:7}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" graph:graph
          echo "published graph for main @ ${SHA:0:7}"

  # The graphify command, packaged for sessions that can't reach the Python package index (build
  # sessions often can't). Downloads graphify and everything it needs as ready-built packages for
  # Linux x86-64 and Python 3.11-3.13, checks they install with no network, and publishes them to
  # the generated `graph-tools` branch. tools/graphify-session.sh installs from there when a normal
  # install fails. Rebuilt only when GRAPHIFY_VERSION changes (or by hand with workflow_dispatch).
  # It also runs on pull requests that change this setup, so a session can be tested before merge;
  # what it publishes depends only on the version, not on the pull request.
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Is this version already published?
        id: have
        run: |
          v="$(git ls-remote "https://github.com/${{ github.repository }}.git" refs/heads/graph-tools | cut -f1)"
          if [ -n "$v" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            got="$(curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/graph-tools/VERSION" || true)"
            if [ "$got" = "$GRAPHIFY_VERSION" ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; echo "::notice::graph-tools already has graphify $got"; exit 0; fi
          fi
          echo "skip=0" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.have.outputs.skip == '0'
        uses: actions/setup-python@v5
        with:
          python-version: |
            3.11
            3.12
            3.13

      - name: Download graphify and its dependencies
        if: steps.have.outputs.skip == '0'
        run: |
          set -eu
          mkdir -p wheelhouse
          for py in 3.11 3.12 3.13; do
            python3.13 -m pip download -q --disable-pip-version-check --dest wheelhouse \
              --only-binary=:all: --implementation cp --python-version "$py" \
              --platform manylinux_2_17_x86_64 --platform manylinux2014_x86_64 \
              --platform manylinux_2_28_x86_64 --platform manylinux_2_34_x86_64 --platform linux_x86_64 \
              "graphifyy==${GRAPHIFY_VERSION}"
          done
          ls wheelhouse | wc -l; du -sh wheelhouse

      - name: Check it installs with no network, on each Python
        if: steps.have.outputs.skip == '0'
        run: |
          set -eu
          for py in 3.11 3.12 3.13; do
            "python$py" -m venv "/tmp/v$py"
            "/tmp/v$py/bin/pip" install -q --disable-pip-version-check --no-index --find-links wheelhouse "graphifyy==${GRAPHIFY_VERSION}"
            "/tmp/v$py/bin/graphify" --help > /dev/null
            echo "python $py: ok"
          done
          # A real query against a tiny graph, end to end.
          mkdir -p /tmp/probe && printf 'def alpha():\n    return beta()\n\ndef beta():\n    return 1\n' > /tmp/probe/m.py
          cd /tmp/probe && /tmp/v3.13/bin/graphify extract . --code-only > /dev/null 2>&1
          /tmp/v3.13/bin/graphify query "what calls beta" | head -20
          find "$GITHUB_WORKSPACE/wheelhouse" -size +95M | grep . && { echo "::error::a package is over GitHub's file limit"; exit 1; } || true

      - name: Publish to the graph-tools branch
        if: steps.have.outputs.skip == '0'
        run: |
          set -eu
          cd wheelhouse && sha256sum *.whl > SHA256SUMS && cd ..
          tmp="$(mktemp -d)"; mv wheelhouse "$tmp/"; cd "$tmp"
          printf '%s\n' "$GRAPHIFY_VERSION" > VERSION
          printf '# graphify packages\n\nGenerated by .github/workflows/graphify.yml: graphify %s and its dependencies for Linux x86-64, Python 3.11-3.13.\nInstalled by tools/graphify-session.sh when the package index is unreachable. Do not edit or archive.\n' "$GRAPHIFY_VERSION" > README.md
          git init -q -b graph-tools
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "graphify ${GRAPHIFY_VERSION} packages"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" graph-tools:graph-tools
          echo "::notice::published graphify ${GRAPHIFY_VERSION} packages ($(ls wheelhouse | wc -l) files, $(du -sh wheelhouse | cut -f1))"
