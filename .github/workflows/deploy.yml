name: Deploy to Cloudflare Pages

# Auto-deploys the static site in /docs to Cloudflare Pages on every push to main.
# Requires two repository secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN  - a scoped token with "Account > Cloudflare Pages > Edit"
#   CLOUDFLARE_ACCOUNT_ID - your Cloudflare account ID
# The first run creates the Pages project automatically; every later push redeploys.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # A push to main publishes to production (main). A manual run
      # (workflow_dispatch) publishes to the "preview" branch alias instead,
      # so branch work can be tested at preview.the-divine-archives.pages.dev
      # without touching production.
      - name: Choose the deploy target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "branch=preview" >> "$GITHUB_OUTPUT"
          else
            echo "branch=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure the Pages project exists (no-op if it already does)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages project create the-divine-archives \
            --production-branch=main \
          || echo "Project already exists (or was created previously) — continuing."

      - name: Deploy /docs to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy docs \
            --project-name=the-divine-archives \
            --branch=${{ steps.target.outputs.branch }}

      - name: Print the URL
        run: |
          if [ "${{ steps.target.outputs.branch }}" = "preview" ]; then
            echo "Preview URL: https://preview.the-divine-archives.pages.dev"
          else
            echo "Production URL: https://the-divine-archives.pages.dev"
          fi
