name: Framework

# Tests for the sandboxed framework (plans/framework-sandbox.md): the event ledger, the
# neutral sequence engine (including the check that no tradition name appears in
# framework/engine/), the ritual and entity schemas, the originality check, and that the
# committed entity registry matches a fresh build of tools/build-entity-registry.js.
# Nothing here touches the live site. If a pull request changes the site's data, rebuild
# the registry with `node tools/build-entity-registry.js` and commit it.

on:
  pull_request:
    paths:
      - "framework/**"
      - "data/rituals/**"
      - "tools/build-entity-registry.js"
      - "tools/originality-*.js"
      - "tools/build-originality-baseline.js"
      - ".github/workflows/framework.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run the framework tests
        run: node --test framework/test/*.test.js
